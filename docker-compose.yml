services:
  ollama:
    image: ollama/ollama:latest
    container_name: awais-youtube-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  ollama-model-pull:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull "$$OLLAMA_MODEL"
    depends_on:
      ollama:
        condition: service_healthy
  app:
    build: .
    container_name: awais-youtube-studio
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OUTPUT_DIR: outputs
      DATABASE_PATH: /app/studio-data/studio.sqlite3
      TTS_VOICE: ${TTS_VOICE:-en-US-GuyNeural}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      ENABLE_YOUTUBE_UPLOAD: ${ENABLE_YOUTUBE_UPLOAD:-false}
      AUTO_PUBLISH: ${AUTO_PUBLISH:-false}
      YOUTUBE_TOKEN_FILE: /app/secrets/youtube-token.json
      YOUTUBE_DEFAULT_PRIVACY: ${YOUTUBE_DEFAULT_PRIVACY:-private}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      COMFYUI_URL: ${COMFYUI_URL:-}
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      ENABLE_DAILY_SCHEDULER: ${ENABLE_DAILY_SCHEDULER:-false}
      DAILY_SHORTS_TOPIC: ${DAILY_SHORTS_TOPIC:-}
      DAILY_SHORTS_COUNT: ${DAILY_SHORTS_COUNT:-3}
      DAILY_SHORTS_LANGUAGE: ${DAILY_SHORTS_LANGUAGE:-English}
      DAILY_SCHEDULE_HOUR: ${DAILY_SCHEDULE_HOUR:-9}
      DAILY_SCHEDULE_MINUTE: ${DAILY_SCHEDULE_MINUTE:-0}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Karachi}
    ports:
      - "8000:8000"
    volumes:
      - video_outputs:/app/outputs
      - studio_data:/app/studio-data
      - ./secrets:/app/secrets:ro
    depends_on:
      ollama-model-pull:
        condition: service_completed_successfully
volumes:
  ollama_data:
  video_outputs:
  studio_data:
